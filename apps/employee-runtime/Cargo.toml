[package]
name = "employee-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
adk-agent = { version = "=2.0.0", features = ["enhanced-plugins"] }
adk-core = "=2.0.0"
adk-devtools = "=2.0.0"
adk-model = { version = "=2.0.0", default-features = false, features = ["openai"] }
adk-plugin = "=2.0.0"
adk-runner = "=2.0.0"
adk-session = { version = "=2.0.0", features = ["sqlite"] }
adk-tool = "=2.0.0"
anyhow = "1"
chrono = { version = "0.4", features = ["clock"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
